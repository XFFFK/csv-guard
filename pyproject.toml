[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "csv-guard"
version = "0.1.0"
description = "Zero-dependency CSV and JSONL contract validation for local checks and GitHub Actions"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "XFFFK"}]

[project.scripts]
csv-guard = "csvguard.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
